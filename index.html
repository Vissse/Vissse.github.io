<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var nativeVT = "startViewTransition" in document;
          if (nativeVT) {
            if (typeof navigation !== "undefined") {
              var markBack = function (e) {
                if (e.viewTransition && navigation.activation && navigation.activation.navigationType === "traverse") {
                  var from = navigation.activation.from ? navigation.activation.from.index : -1;
                  var to = navigation.activation.entry ? navigation.activation.entry.index : -1;
                  if (to < from) document.documentElement.classList.add("vt-back");
                }
              };
              addEventListener("pageswap", markBack);
              addEventListener("pagereveal", markBack);
            }
            return;
          }

          /* Manual fallback slide transition for browsers without cross-document View Transitions (Firefox, Safari) */
          var STORE_KEY = "vt-direction";
          var navEntries = performance.getEntriesByType ? performance.getEntriesByType("navigation") : [];
          var navType = navEntries.length ? navEntries[0].type : "navigate";
          var storedDir = sessionStorage.getItem(STORE_KEY);
          sessionStorage.removeItem(STORE_KEY);
          var enterLeft = storedDir === "back" || (!storedDir && navType === "back_forward");
          document.documentElement.classList.add(enterLeft ? "vt-enter-left" : "vt-enter-right");
          addEventListener("pageshow", function () {
            document.documentElement.classList.remove("vt-enter-left", "vt-enter-right");
          });

          document.addEventListener(
            "click",
            function (e) {
              if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
              var a = e.target.closest("a[href]");
              if (!a || a.hasAttribute("download") || (a.target && a.target !== "" && a.target !== "_self")) return;
              var url;
              try {
                url = new URL(a.href, location.href);
              } catch (err) {
                return;
              }
              if (url.origin !== location.origin || url.pathname === location.pathname) return;
              var isBack = a.classList.contains("back-link");
              e.preventDefault();
              sessionStorage.setItem(STORE_KEY, isBack ? "back" : "forward");
              document.documentElement.classList.add(isBack ? "vt-exit-right" : "vt-exit-left");
              setTimeout(function () {
                location.href = a.href;
              }, 260);
            },
            true
          );
        } catch (e) {
          /* decorative only */
        }
      })();
    </script>
    <title>Vít Šebestík | Osobní web</title>
    <meta name="description" content="Osobní web a portfolio - Vít Šebestík. Zjistěte více o mně a mých projektech." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
